[workspace]
members = [".", "fuzz"]

[package]
name = "palinka"
version = "0.0.0"
edition = "2024"

[profile.lto]
inherits = "release"
lto = "fat"

[profile.profiling]
inherits = "release"
debug = true
lto = "fat"

[dependencies]
anyhow = "1.0.102"
arbitrary = { version = "1.4.2", features = ["derive"] }
argh = "0.1.16"
ariadne = "0.6.0"
chumsky = "0.12.0"
const-hex = "1.18.0"
crossterm = "0.29.0"
either = "1.15.0"
hex-literal = "1.1.0"
indexmap = "2.13.0"
ratatui = "0.30.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["ansi", "env-filter"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
bindgen = "0.72.1"

[features]
tracing-off = ["tracing/max_level_off"]

[[bench]]
name = "ops"
harness = false
